<!doctype html><meta charset="utf-8"><title>RUNNING</title>
<pre id="log"></pre><iframe id="app" src="index.html" style="width:820px;height:1180px;border:0"></iframe>
<script>
(async function () {
  var out = [], frame = document.getElementById('app');
  function ok(name, value, detail) { out.push((value ? 'PASS | ' : 'FAIL | ') + name + (detail ? ' :: ' + detail : '')); }
  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  await new Promise(function (resolve) { frame.onload = resolve; });
  var w = frame.contentWindow, d = frame.contentDocument;
  var runtimeErrors=[];
  w.addEventListener('error',function(e){runtimeErrors.push(e.message||'error');});
  w.addEventListener('unhandledrejection',function(e){runtimeErrors.push(String(e.reason||'rejection'));});
  await w.RT.store.ready();
  w.RT.app.go('new');
  d.getElementById('newText').value = '学习需要持续练习，普通内容也应该能够通过长按进行挖空。 alpha beta';
  d.getElementById('btnCreate').click();
  await sleep(350);
  var paper = d.getElementById('paper');
  ok('页面进入设计状态', paper && paper.classList.contains('mode-design'));

  function fire(type, x, y, target) {
    var touch = new w.Touch({identifier:1,target:target,clientX:x,clientY:y,pageX:x,pageY:y});
    var ev = new w.TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'?[]:[touch],targetTouches:type==='touchend'?[]:[touch],changedTouches:[touch]});
    target.dispatchEvent(ev); return ev;
  }

  var suggest = paper.querySelector('.tk.suggest');
  ok('存在虚线建议词', !!suggest);
  if (suggest) {
    var sr=suggest.getBoundingClientRect();
    fire('touchstart',sr.left+2,sr.top+2,suggest); await sleep(420); fire('touchend',sr.left+2,sr.top+2,suggest); await sleep(20);
    ok('虚线词长按不会打开多余浮层', d.getElementById('selPop').hidden);
    var beforeSuggest = w.RT.app.state.blanks.length;
    suggest.click(); await sleep(80);
    ok('虚线词单击一次挖空', w.RT.app.state.blanks.length === beforeSuggest + 1);
  }
  var blue = paper.querySelector('.tk.on:not(.forced)');
  ok('存在可取消蓝色词块', !!blue);
  if (blue) {
    var brc=blue.getBoundingClientRect();
    fire('touchstart',brc.left+2,brc.top+2,blue); await sleep(420); fire('touchend',brc.left+2,brc.top+2,blue); await sleep(20);
    ok('蓝色词块长按不会打开多余浮层', d.getElementById('selPop').hidden);
    var beforeBlue = w.RT.app.state.blanks.length;
    blue.click(); await sleep(80);
    ok('蓝色词块单击一次取消', w.RT.app.state.blanks.length === beforeBlue - 1);
  }

  paper = d.getElementById('paper');
  var ordinary = null, walker = d.createTreeWalker(paper, w.NodeFilter.SHOW_TEXT, null), node;
  while ((node = walker.nextNode())) {
    if (node.parentElement === paper && node.nodeValue.trim()) { ordinary = node; break; }
  }
  ok('存在普通正文文本', !!ordinary);
  if (ordinary) {
    var pressChar=Math.min(2,ordinary.nodeValue.length-1);
    var beforePress=d.createRange();beforePress.selectNodeContents(paper);beforePress.setEnd(ordinary,pressChar);
    var pressOffset=beforePress.toString().length;
    var range = d.createRange(); range.setStart(ordinary,pressChar); range.setEnd(ordinary,pressChar+1);
    var rect = range.getBoundingClientRect(), x=rect.left+rect.width/2, y=rect.top+rect.height/2;
    try { Object.defineProperty(d,'caretRangeFromPoint',{value:undefined,configurable:true}); } catch (_) {}
    try { Object.defineProperty(d,'caretPositionFromPoint',{value:undefined,configurable:true}); } catch (_) {}
    fire('touchstart',x,y,paper); await sleep(420); fire('touchend',x,y,paper); await sleep(40);
    ok('iPad API 缺失时普通正文静止长按有高亮', d.querySelectorAll('#selLayer .sel-hl').length > 0);
    var pressedLayer=d.getElementById('selLayer'),pressedS=+(pressedLayer&&pressedLayer.getAttribute('data-range-start')),pressedE=+(pressedLayer&&pressedLayer.getAttribute('data-range-end'));
    ok('长按落点与最终选区严格对应', pressedS<=pressOffset && pressOffset<pressedE, 'press='+pressOffset+' selected='+pressedS+','+pressedE);
    ok('普通正文静止长按显示挖空按钮', !d.getElementById('selPop').hidden && !d.getElementById('selAdd').hidden);
    ok('长按未创建浏览器原生选区', !w.getSelection().rangeCount || w.getSelection().isCollapsed);
    var handles=d.querySelectorAll('#selLayer .sel-handle');
    ok('长按后显示左右两个范围手柄', handles.length===2);
    if(handles.length===2){
      var selectionRect=d.querySelector('#selLayer .sel-hl').getBoundingClientRect();
      var startCenter=handles[0].getBoundingClientRect().top+handles[0].getBoundingClientRect().height/2;
      var endCenter=handles[1].getBoundingClientRect().top+handles[1].getBoundingClientRect().height/2;
      ok('左右手柄与选区同一高度，便于水平拖动',
        Math.abs(startCenter-(selectionRect.top+selectionRect.height/2))<2 && Math.abs(endCenter-(selectionRect.top+selectionRect.height/2))<2,
        'start='+Math.round(startCenter)+' end='+Math.round(endCenter)+' selection='+Math.round(selectionRect.top+selectionRect.height/2));
      var startBox=handles[0].getBoundingClientRect(), endBox=handles[1].getBoundingClientRect();
      ok('圆点置于选区左右外侧，不遮盖文字',
        startBox.left+30<=selectionRect.left && endBox.right-30>=selectionRect.right,
        'startRight='+Math.round(startBox.left+30)+' selectionLeft='+Math.round(selectionRect.left)+' endLeft='+Math.round(endBox.right-30)+' selectionRight='+Math.round(selectionRect.right));
    }
    var endHandle=d.querySelector('#selLayer .sel-handle.end');
    var laterNode=null, laterWalk=d.createTreeWalker(paper,w.NodeFilter.SHOW_TEXT,null), ln;
    while((ln=laterWalk.nextNode())) {
      if(ln.nodeValue && ln.nodeValue.trim() && ln!==ordinary && !ln.parentElement.closest('#selLayer')){
        var probe=d.createRange();probe.setStart(ln,0);probe.setEnd(ln,Math.min(1,ln.nodeValue.length));
        var probeRect=probe.getBoundingClientRect();if(probeRect.width||probeRect.height)laterNode=ln;
      }
    }
    if(endHandle && laterNode){
      var lr=d.createRange();lr.setStart(laterNode,0);lr.setEnd(laterNode,Math.min(1,laterNode.nodeValue.length));
      var lrc=lr.getBoundingClientRect(), eh=endHandle.getBoundingClientRect();
      var expectedRange=d.createRange();expectedRange.selectNodeContents(paper);expectedRange.setEnd(laterNode,Math.min(1,laterNode.nodeValue.length));
      var expectedOffset=expectedRange.toString().length;
      var nativeCreateRange=d.createRange.bind(d), dragRangeCreates=0;
      d.createRange=function(){dragRangeCreates++;return nativeCreateRange();};
      fire('touchstart',eh.left+eh.width/2,eh.top+eh.height/2,endHandle);
      var handleMove;
      for(var dragStep=0;dragStep<16;dragStep++){
        handleMove=fire('touchmove',dragStep%2?lrc.left:lrc.right,lrc.top+lrc.height/2,d);
      }
      fire('touchend',lrc.right,lrc.top+lrc.height/2,d);await sleep(40);
      d.createRange=nativeCreateRange;
      ok('拖动右手柄时由应用接管手势', handleMove.defaultPrevented);
      ok('连续拖动不重复扫描全文（16 次更新）', dragRangeCreates<=20, dragRangeCreates+' 个 Range');
      var layerAfter=d.getElementById('selLayer');
      ok('拖动后左右手柄和高亮仍然存在', d.querySelectorAll('#selLayer .sel-handle').length===2 && d.querySelectorAll('#selLayer .sel-hl').length>0,
        layerAfter ? layerAfter.getAttribute('data-range-start')+','+layerAfter.getAttribute('data-range-end')+' expected='+expectedOffset : 'no layer');
      var startHandle=d.querySelector('#selLayer .sel-handle.start'), shrinkNode=null;
      var shrinkWalk=d.createTreeWalker(paper,w.NodeFilter.SHOW_TEXT,null), sn;
      while((sn=shrinkWalk.nextNode())){
        if(!sn.nodeValue||!sn.nodeValue.trim()||sn.parentElement.closest('#selLayer'))continue;
        var er=d.createRange();er.selectNodeContents(paper);er.setEnd(sn,Math.min(1,sn.nodeValue.length));
        var eo=er.toString().length;if(eo>2&&eo<expectedOffset-1){shrinkNode=sn;break;}
      }
      if(startHandle&&shrinkNode){
        var shr=d.createRange();shr.setStart(shrinkNode,0);shr.setEnd(shrinkNode,Math.min(1,shrinkNode.nodeValue.length));
        var shrc=shr.getBoundingClientRect(), sh=startHandle.getBoundingClientRect();
        fire('touchstart',sh.left+sh.width/2,sh.top+sh.height/2,startHandle);
        var shrinkMove=fire('touchmove',shrc.right,shrc.top+shrc.height/2,startHandle);
        fire('touchend',shrc.right,shrc.top+shrc.height/2,startHandle);await sleep(40);
        var shrunkLayer=d.getElementById('selLayer'), shrunkStart=+(shrunkLayer&&shrunkLayer.getAttribute('data-range-start'));
        ok('拖动左手柄时由应用接管手势', shrinkMove.defaultPrevented);
        ok('左手柄可向右缩短挖空范围', shrunkStart>0 && shrunkStart<+(shrunkLayer&&shrunkLayer.getAttribute('data-range-end')),
          shrunkLayer ? shrunkLayer.getAttribute('data-range-start')+','+shrunkLayer.getAttribute('data-range-end') : 'no layer');
      }
    }
    var beforeAdd = w.RT.app.state.customRanges.length;
    d.getElementById('selAdd').click(); await sleep(100);
    ok('长按后点击加号完成挖空', w.RT.app.state.customRanges.length === beforeAdd + 1);
    var adjusted=w.RT.app.state.customRanges[w.RT.app.state.customRanges.length-1];
    ok('调整后的范围按新边界挖空', !!adjusted && adjusted[1]-adjusted[0]>1, adjusted ? adjusted.join(',') : 'none');
    if(adjusted){
      var expectedText=(w.RT.app.state.cur.text||'').slice(adjusted[0],adjusted[1]);
      var blankText=w.RT.app.state.toks.filter(function(tok){return tok._blank && tok.p>=adjusted[0] && tok.p+tok.s.length<=adjusted[1];}).map(function(tok){return tok.s;}).join('');
      ok('确认挖空后的蓝色词严格对应调整选区', blankText===expectedText, 'expected='+expectedText+' actual='+blankText);
      var blueBlocks=[].slice.call(d.querySelectorAll('#paper .tk.on.manual:not(.forced)'));
      ok('跨空格的连续手选只渲染为一个蓝色块', blueBlocks.length===1,
        blueBlocks.length+' 块，文本='+blueBlocks.map(function(el){return el.textContent;}).join(' | '));
      ok('连续蓝色块与调整后的选区逐字一致', !!blueBlocks[0] && blueBlocks[0].textContent===expectedText,
        'range='+adjusted.join(',')+' expected='+expectedText+' actual='+(blueBlocks[0]&&blueBlocks[0].textContent)+' toks='+w.RT.app.state.toks.filter(function(tok){return tok._blank;}).map(function(tok){return tok.p+':'+tok.s;}).join('/'));
    }

    await sleep(850);
    paper = d.getElementById('paper');
    var direct = null, walk2 = d.createTreeWalker(paper,w.NodeFilter.SHOW_TEXT,null);
    while ((node=walk2.nextNode())) { if(node.parentElement===paper && node.nodeValue.trim()){ direct=node; break; } }
    if (direct) {
      var r2=d.createRange(); r2.setStart(direct,0); r2.setEnd(direct,1); var q=r2.getBoundingClientRect();
      var h1=fire('touchstart',q.left+2,q.top+2,paper); var hm=fire('touchmove',q.left+52,q.top+2,paper); fire('touchend',q.left+52,q.top+2,paper); await sleep(30);
      ok('横向移动不触发拖选', d.getElementById('selPop').hidden && !d.querySelector('#selLayer .sel-hl'));
      ok('横向移动未被脚本锁死', !hm.defaultPrevented);
      var v1=fire('touchstart',q.left+2,q.top+2,paper); var vm=fire('touchmove',q.left+2,q.top+62,paper); fire('touchend',q.left+2,q.top+62,paper); await sleep(30);
      ok('纵向滑动不触发长按', d.getElementById('selPop').hidden);
      ok('纵向滑动未被 preventDefault', !vm.defaultPrevented);
    }
  }

  var target = paper.querySelector('.tk') || paper;
  var ss = new w.Event('selectstart',{bubbles:true,cancelable:true}); target.dispatchEvent(ss);
  var cm = new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true}); target.dispatchEvent(cm);
  ok('触屏正文阻止原生选区', ss.defaultPrevented);
  ok('触屏正文阻止复制翻译菜单', cm.defaultPrevented);

  paper = d.getElementById('paper');
  var cancelTarget = paper;
  var cancelTouch = new w.Touch({identifier:2,target:cancelTarget,clientX:10,clientY:10,pageX:10,pageY:10});
  cancelTarget.dispatchEvent(new w.TouchEvent('touchstart',{bubbles:true,cancelable:true,touches:[cancelTouch],targetTouches:[cancelTouch],changedTouches:[cancelTouch]}));
  cancelTarget.dispatchEvent(new w.TouchEvent('touchcancel',{bubbles:true,cancelable:true,touches:[],targetTouches:[],changedTouches:[cancelTouch]}));
  await sleep(420);
  ok('touchcancel 后不会延迟弹出幽灵浮层', d.getElementById('selPop').hidden && !d.querySelector('#selLayer .sel-hl'));

  ok('移动端页面不再显示多余模式开关', !d.getElementById('btnTouchSel'));
  d.dispatchEvent(new w.MouseEvent('mousemove',{bubbles:true}));
  paper = d.getElementById('paper');
  var deskNode = null, deskWalk = d.createTreeWalker(paper,w.NodeFilter.SHOW_TEXT,null);
  while ((node=deskWalk.nextNode())) { if(node.parentElement===paper && node.nodeValue && node.nodeValue.trim()){ deskNode=node; break; } }
  if (deskNode) {
    var deskRange=d.createRange(); deskRange.setStart(deskNode,0); deskRange.setEnd(deskNode,Math.min(2,deskNode.nodeValue.length));
    var selection=w.getSelection(); selection.removeAllRanges(); selection.addRange(deskRange);
    d.dispatchEvent(new w.MouseEvent('mouseup',{bubbles:true,cancelable:true})); await sleep(30);
    ok('桌面 mouseup 划词路径仍正常', !d.getElementById('selPop').hidden);
    selection.removeAllRanges();
  }
  var textarea=d.getElementById('newText');
  var inputMenu=new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true}); textarea.dispatchEvent(inputMenu);
  ok('输入框仍允许系统复制菜单', !inputMenu.defaultPrevented);
  ok('完整交互过程无脚本异常', runtimeErrors.length===0, runtimeErrors.join(' | '));

  document.getElementById('log').textContent = out.join('\n');
  var failures = out.filter(function (line) { return line.indexOf('FAIL') === 0; }).length;
  document.title = 'E2E_DONE_' + failures + '_' + out.length;
})();
</script>
